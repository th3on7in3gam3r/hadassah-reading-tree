<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reading Tree">
<meta name="theme-color" content="#2e6a4e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Hadassah's Reading Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&display=swap">
<style>
/* Layout: one calm reading column; a myrtle tree that blossoms with every star sits on top, phonics units below, story shelf last. */
:root{
  --bg:#eef4ee; --paper:#fffefb; --ink:#1d2a23; --muted:#56675d; --line:#d3e0d6; --soft:#e3ebe4;
  --myrtle:#2e6a4e; --leaf:#5f9e78; --leaf2:#86b998; --bark:#7b5a43;
  --blossom:#e0648c; --blossom-ink:#a8325c; --blossom-soft:#fbe2ea; --sun:#efb12a; --sun-soft:#fdf0cc;
  --good:#2f8a55; --good-soft:#ddf2e4; --try:#c0603a; --try-soft:#fbe7dd; --suffix:#3d63b8; --suffix-soft:#e2e9fa;
  --display:"Grandstander","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --body:"Andika","Verdana","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111c17; --paper:#1a2821; --ink:#ecf3ee; --muted:#a3b5aa; --line:#2c3f35; --soft:#22322a;
  --myrtle:#86cfa6; --leaf:#3f7a58; --leaf2:#2f6247; --bark:#a47c5e;
  --blossom:#f08cad; --blossom-ink:#f5a8c2; --blossom-soft:#3a2430; --sun:#f4c552; --sun-soft:#3a3220;
  --good:#6fd39a; --good-soft:#1d3a2a; --try:#f09a72; --try-soft:#3d2a20; --suffix:#9db7f2; --suffix-soft:#243250; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111c17; --paper:#1a2821; --ink:#ecf3ee; --muted:#a3b5aa; --line:#2c3f35; --soft:#22322a;
  --myrtle:#86cfa6; --leaf:#3f7a58; --leaf2:#2f6247; --bark:#a47c5e;
  --blossom:#f08cad; --blossom-ink:#f5a8c2; --blossom-soft:#3a2430; --sun:#f4c552; --sun-soft:#3a3220;
  --good:#6fd39a; --good-soft:#1d3a2a; --try:#f09a72; --try-soft:#3d2a20; --suffix:#9db7f2; --suffix-soft:#243250; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:740px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,6vw,40px);font-weight:800;color:var(--myrtle)}
h2{font-size:24px;font-weight:800}
h3{font-size:19px;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--blossom);outline-offset:3px}

.hero{display:flex;flex-direction:column;gap:6px}
.hero p{color:var(--muted);max-width:52ch}
.treecard{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:14px 14px 12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.treecard svg{width:100%;max-width:420px;height:auto;display:block}
.tally{font-family:var(--display);font-weight:600;font-size:18px;display:flex;gap:8px;align-items:baseline}
.tally .n{color:var(--blossom-ink);font-size:26px;font-variant-numeric:tabular-nums}
.rule{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--muted)}
.rule .star{width:18px;height:18px}

.sectionhead{display:flex;flex-direction:column;gap:2px}
.sectionhead p{color:var(--muted);font-size:15px}
.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

/* Units */
.unit{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.unit.here{border-color:var(--leaf)}
.unit.locked{background:var(--soft);border-style:dashed}
.unithead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.unithead .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.unithead .sub{color:var(--muted);font-size:15px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--good-soft);color:var(--myrtle);white-space:nowrap}
.chip.count{background:var(--sun-soft);color:var(--ink);text-transform:none;letter-spacing:0;font-size:14px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.step{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:72px;min-width:0}
.step:hover{border-color:var(--leaf)}
.step .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.step .nm{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.2}
.step .done{font-size:14px;font-weight:700;color:var(--good)}
.step .todo{font-size:14px;color:var(--muted)}
.lockmsg{font-size:15px;color:var(--muted);display:flex;gap:8px;align-items:center}
.lockmsg svg{flex:none}
.later{font-size:15px;color:var(--muted);text-align:center}

/* Shelf */
.shelf{display:flex;flex-direction:column;gap:14px}
.levelhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.levelhead .note{color:var(--muted);font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.card:hover:not(:disabled){border-color:var(--leaf)}
.card:disabled{cursor:default;opacity:.55}
.kind{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:999px;background:var(--blossom-soft);color:var(--blossom-ink)}
.kind.every{background:var(--good-soft);color:var(--myrtle)}
.card h3{font-size:17px}
.stars{display:inline-flex;gap:3px}
.star{width:20px;height:20px;flex:none}
.star path{fill:var(--line)}
.star.on path{fill:var(--sun)}

/* Shared screens */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 16px;min-height:44px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--leaf)}
.btn.go{background:var(--myrtle);border-color:var(--myrtle);color:var(--paper);font-family:var(--display);font-size:19px;padding:12px 24px}
.btn.go:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px;flex:none}
.page{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:24px clamp(18px,5vw,36px);display:flex;flex-direction:column;gap:16px}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tip{font-size:14px;color:var(--muted)}
.center{display:flex;justify-content:center}
.lead{font-size:18px;color:var(--muted)}

/* Story */
.story{font-size:clamp(20px,4.6vw,23px);line-height:1.75;display:flex;flex-direction:column;gap:14px;max-width:34em}
.w{border-radius:6px;padding:0 1px;cursor:pointer}
.w:hover{background:var(--blossom-soft)}
.w.said{background:var(--sun);color:#1d2a23}
.w.trick{text-decoration:underline wavy var(--blossom);text-underline-offset:5px;text-decoration-thickness:2px}

/* Sound cards */
.soundgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sound{background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.sound:hover{border-color:var(--leaf)}
.sound.heard{border-color:var(--good);background:var(--good-soft)}
.sound .pat{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.1;color:var(--myrtle)}
.sound .kw{font-size:19px}
.sound .kw b{color:var(--blossom-ink)}
.note{background:var(--sun-soft);border-radius:14px;padding:12px 14px;font-size:17px}

/* Tap & read */
.taprow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.tapbox{min-width:72px;min-height:84px;padding:8px 14px;border-radius:16px;border:3px solid var(--line);background:var(--bg);font-family:var(--display);font-weight:800;font-size:44px;line-height:1;display:flex;align-items:center;justify-content:center}
.tapbox.suffix{border-color:var(--suffix);background:var(--suffix-soft);color:var(--suffix)}
.tapbox.lit{background:var(--sun);border-color:var(--sun);color:#1d2a23}
.dotrow{display:flex;justify-content:center;gap:10px}
.tapdot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.tapdot.lit{background:var(--sun)}
.whole{font-family:var(--display);font-weight:800;font-size:clamp(44px,12vw,64px);text-align:center;letter-spacing:.02em;min-height:1.3em;color:var(--myrtle)}
.whole.dim{color:var(--line)}

/* Quiz & games */
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.now{background:var(--blossom)}
.dot.done{background:var(--leaf)}
.skill{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--myrtle)}
.q{font-size:clamp(21px,4.8vw,25px);font-family:var(--display);font-weight:600;line-height:1.3}
.sentence{font-size:22px;line-height:1.5}
.blank{display:inline-block;min-width:3.4em;border-bottom:3px solid var(--ink);margin:0 4px}
.bigsay{align-self:center;width:96px;height:96px;border-radius:50%;border:3px solid var(--leaf);background:var(--good-soft);color:var(--myrtle);display:flex;align-items:center;justify-content:center}
.bigsay svg{width:44px;height:44px}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:14px 18px;min-height:56px;text-align:left;font-size:20px;display:flex;gap:12px;align-items:center}
.opts.words .opt{justify-content:center;font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.02em}
.opts.vowels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.opts.vowels .opt{justify-content:center;padding:12px 4px;font-family:var(--display);font-weight:800;font-size:36px;min-height:72px}
.vblank{display:inline-block;min-width:.75em;border-bottom:6px solid var(--blossom);margin:0 .06em;color:var(--blossom-ink)}
.opt .ab{font-family:var(--display);font-weight:800;color:var(--muted);flex:none;width:1.4em}
.opt:hover:not(:disabled){border-color:var(--leaf)}
.opt.right,.hid.right{background:var(--good-soft);border-color:var(--good);animation:pop .5s both}
.opt.wrong{background:var(--try-soft);border-color:var(--try);opacity:.8}
.opt:disabled{cursor:default}
.feedback{border-radius:16px;padding:14px 16px;font-size:18px;display:flex;flex-direction:column;gap:8px}
.feedback.ok{background:var(--good-soft)}
.feedback.hint{background:var(--try-soft)}
.feedback b{font-family:var(--display)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.peek{font-size:17px;line-height:1.65;border-left:4px solid var(--line);padding-left:14px;color:var(--muted);display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}

/* Result */
.result{align-items:center;text-align:center}
.bigstars{display:flex;gap:10px}
.bigstars .star{width:56px;height:56px}
.pop{animation:pop .5s both}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.gain{display:flex;align-items:center;gap:10px;background:var(--blossom-soft);border-radius:16px;padding:12px 16px;font-family:var(--display);font-weight:600;font-size:19px;text-align:left}
.gain svg{width:34px;height:34px;flex:none}
.keyrow{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;text-align:left;font-size:16px;background:var(--bg);border-radius:14px;padding:12px 14px}
.keyrow .stars .star{width:18px;height:18px}
.keyrow .me{font-weight:700}
.unlock{background:var(--good-soft);border-radius:16px;padding:12px 16px;font-family:var(--display);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* Grown-ups */
details.grown{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px 16px}
details.grown summary{font-weight:700;cursor:pointer;color:var(--muted);min-height:32px}
.gbody{display:flex;flex-direction:column;gap:12px;margin-top:12px;font-size:15px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.small{font-size:14px;color:var(--muted)}
.btn.danger{border-color:var(--try);color:var(--try)}

/* Garden Journal */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.stat svg{width:24px;height:24px;color:var(--blossom)}
.stat .big{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;color:var(--myrtle);font-variant-numeric:tabular-nums}
.stat>span:last-child{font-size:14px;color:var(--muted)}
.badgegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.badge{background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0}
.badge .med{width:50px;height:50px;border-radius:50%;background:var(--sun-soft);color:var(--sun);display:flex;align-items:center;justify-content:center;flex:none}
.badge .med svg{width:26px;height:26px}
.badge b{font-family:var(--display);font-weight:600;font-size:13px;line-height:1.15}
.badge small{font-size:11px;color:var(--muted);line-height:1.25}
.badge.on{border-color:var(--sun)}
.badge.off{opacity:.55}
.badge.off .med{background:var(--soft);color:var(--muted)}
.barrow{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:baseline;font-size:15px}
.barrow .pct{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{grid-column:1/-1;height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.fill{height:100%;border-radius:999px;background:var(--leaf)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipword{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:700;font-size:16px;display:inline-flex;gap:6px;align-items:baseline}
.chipword i{font-style:normal;font-size:12px;color:var(--try)}
.chipword:hover{border-color:var(--leaf)}
.dayrow{display:flex;gap:6px;flex-wrap:wrap}
.day{width:34px;height:34px;border-radius:12px;background:var(--soft);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px}
.day.on{background:var(--good-soft)}

/* Grown-up gate & lesson log */
.pin{font:inherit;font-size:32px;letter-spacing:.5em;text-align:center;width:9em;max-width:100%;padding:10px 0 10px .5em;border:2px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink)}
.pin:focus{outline:3px solid var(--blossom);outline-offset:2px;border-color:var(--leaf)}
.pin.code{letter-spacing:0;font-size:22px;width:18em;padding:10px 14px;font-family:var(--body)}
.today{border-width:2px}
.today.yes{border-color:var(--good);background:var(--good-soft)}
.today.no{border-color:var(--try);background:var(--try-soft)}
.today ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.linkbtn{background:none;border:0;color:var(--muted);font-size:14px;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;min-height:44px}
.linkbtn:hover{color:var(--ink);background:var(--soft)}
.linkbtn svg{width:16px;height:16px}
.rule svg{width:18px;height:18px;flex:none}

.blossom{transform-box:fill-box;transform-origin:center}
.blossom.new{animation:bloom 1.15s both}
@keyframes bloom{0%{transform:scale(.15);opacity:0}45%{transform:scale(2.4)}100%{transform:scale(1);opacity:1}}
.crown.sway{transform-box:view-box;transform-origin:160px 150px;animation:sway 1.6s ease}
@keyframes sway{20%{transform:rotate(-3.5deg)}55%{transform:rotate(3.5deg)}100%{transform:rotate(0)}}
.spark{animation:rise 1.3s ease-out both}
@keyframes rise{from{transform:translate(155px,200px) scale(1)}to{transform:translate(155px,28px) scale(.4);opacity:0}}
.bloomnote{display:flex;align-items:center;gap:12px;background:var(--blossom-soft);border:3px solid var(--blossom);border-radius:18px;padding:14px 16px;font-family:var(--display);font-size:22px;font-weight:800}
.bloomnote svg{width:52px;height:52px;flex:none}
.visitor.new{animation:pop .7s both}
.sound{min-height:92px;transition:transform .15s}
.sound:active,.tapbox:active,.opt:active,.step:active,.card:active,.btn:active{transform:scale(.97)}
.sound.bounce{animation:pop .35s}
.tapbox{transition:transform .15s,background .15s}
.tapbox.grow{animation:pop .28s}
.whole.glow{animation:glow .8s ease}
@keyframes glow{40%{text-shadow:0 0 16px var(--sun)}}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.slotrow{display:flex;gap:8px;justify-content:center;min-height:72px}
.slot,.tile{min-width:52px;min-height:64px;border-radius:14px;border:3px solid var(--line);background:var(--bg);font-family:var(--display);font-weight:800;font-size:32px;display:flex;align-items:center;justify-content:center;touch-action:none}
.slot{border-style:dashed}
.slot.filled{border-style:solid;border-color:var(--leaf);background:var(--good-soft)}
.slot.just{animation:slotpop .55s both}
@keyframes slotpop{0%{transform:scale(.45)}50%{transform:scale(1.22);box-shadow:0 0 0 8px var(--sun-soft)}100%{transform:scale(1);box-shadow:0 0 0 0 var(--sun-soft)}}
.slotrow.glowwin .slot{animation:slotpop .7s both}
.tile{cursor:grab;background:var(--paper)}
.tile.dragging{position:relative;z-index:3;cursor:grabbing}
.seek{position:relative;min-height:220px;border-radius:18px;overflow:hidden;background:linear-gradient(#d7ebe3,#f4efe4)}
.seek svg{width:100%;height:180px;display:block}
.hid{position:absolute;min-height:48px;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 12px;font-weight:800}
.hid.right,.tile.right{background:var(--good-soft);border-color:var(--good)}
.hid.wrong,.tile.wrong{background:var(--try-soft);border-color:var(--try)}
.storyscene{width:100%;max-height:240px;border-radius:16px;background:var(--soft)}
.story p.on{background:var(--sun-soft);border-radius:8px}
.confetti{position:relative;height:78px;pointer-events:none}
.confetti i{position:absolute;left:50%;top:8px;width:14px;height:18px;border-radius:10px;background:var(--blossom);animation:fall 1.35s ease-in both}
@keyframes fall{to{transform:translate(var(--x),120px) rotate(70deg);opacity:0}}
.flywrap{position:relative;width:min(100%,240px);height:190px;margin:0 auto}
.minitree,.minitree svg{width:100%;height:auto}
.minitree.land{animation:treepulse .7s 1s both}
@keyframes treepulse{40%{transform:scale(1.08)}}
.flystar{position:absolute;left:0;top:78px}
.flystar .star{width:76px;height:76px;filter:drop-shadow(0 0 10px #efb12a)}
.flystar.go{animation:flystar 1.35s cubic-bezier(.2,.7,.2,1) both}

/* Folds another device's copy into this one. Lessons are unioned, bests keep the higher result,

function mergeRemote(r){
  if(!r||typeof r!=="object")return false;
  let ch=false;

  if(r.pin&&(!lp||((r.pinAt||0)>(lp.at||0)&&r.pin!==lp.h))){storePin(r.pin,r.pinAt||0);ch=true}
  let childName=S.childName||"",nameAt=S.nameAt||0,decor=S.decor||{},decorAt=S.decorAt||0;
  if(r.childName&&(r.nameAt||0)>nameAt){const next=String(r.childName).replace(/[<>&]/g,"").trim().slice(0,24);if(next){childName=next;nameAt=r.nameAt||0;ch=true}}
  if(r.decor&&typeof r.decor==="object"&&(r.decorAt||0)>decorAt){
    const d={};
    if(FLOWERS[r.decor.flower])d.flower=r.decor.flower;
    if(BIRDS[r.decor.bird])d.bird=r.decor.bird;
    if(r.decor.swing)d.swing=true;
    decor=d;decorAt=r.decorAt||0;ch=true;
  }
  const rr=r.resetAt||0,lr=S.resetAt||0;
  if(lr>rr){S.childName=childName;S.nameAt=nameAt;S.decor=decor;S.decorAt=decorAt;return ch}
  if(rr>lr){S={best:{},done:{},unlockAll:false,history:[],days:[],skills:{},words:{},resetAt:rr,settingsAt:0,watered:"",seen:{miles:[],facts:[]}};ch=true}
  S.childName=childName;S.nameAt=nameAt;S.decor=decor;S.decorAt=decorAt;
  S.seen=S.seen||{miles:[],facts:[]};S.seen.miles=S.seen.miles||[];S.seen.facts=S.seen.facts||[];
  if(/^\d{4}-\d{2}-\d{2}$/.test(r.watered||"")&&(!S.watered||r.watered>S.watered)){S.watered=r.watered;ch=true}
  for(const m of (r.seen&&r.seen.miles)||[])if((m===5||m===10||m===15)&&!S.seen.miles.includes(m)){S.seen.miles.push(m);ch=true}
  for(const f of (r.seen&&r.seen.facts)||[]){const n=+f;if(n>=1&&n<=20&&Number.isInteger(n)&&!S.seen.facts.includes(n)){S.seen.facts.push(n);ch=true}}
  for(const id in r.best||{}){const a=S.best[id],b=r.best[id];if(!b)continue;
    if(!a||b.stars>a.stars||(b.stars===a.stars&&((b.score||0)>(a.score||0)||(b.last||"")>(a.last||"")))){S.best[id]={...b,tries:Math.max(b.tries||0,a?a.tries||0:0)};ch=true}
    else if((b.tries||0)>(a.tries||0)){a.tries=b.tries;ch=true}}
  const hk=h=>`${h.id}|${h.d}|${h.t||""}|${h.ts||""}`,seen=new Set(S.history.map(hk));
  for(const h of r.history||[])if(!seen.has(hk(h))){S.history.push(h);seen.add(hk(h));ch=true}
  const when=h=>h.ts||Date.parse(h.d+"T12:00")||0;
  S.history.sort((a,b)=>when(a)-when(b));if(S.history.length>300)S.history=S.history.slice(-300);
  for(const d of r.days||[])if(!S.days.includes(d)){S.days.push(d);ch=true}
  S.days.sort();
  for(const k in r.skills||{}){const a=S.skills[k],b=r.skills[k];if(b&&(!a||b[1]>a[1])){S.skills[k]=b.slice();ch=true}}
  for(const w in r.words||{})if((r.words[w]||0)>(S.words[w]||0)){S.words[w]=r.words[w];ch=true}
  for(const k in r.done||{})if(r.done[k]&&!S.done[k]){S.done[k]=true;ch=true}
  if((r.settingsAt||0)>(S.settingsAt||0)){S.unlockAll=!!r.unlockAll;S.settingsAt=r.settingsAt;ch=true}
  return ch;
}
/* pull → "changed" | "same" | "none" (nothing stored for this code yet) | "error" (see sync.msg) */
async function pull(){
  if(!canSync||!getCode())return "none";
  sync.status="busy";
  try{const j=await api("GET");const res=j.data?(mergeRemote(j.data)?"changed":"same"):"none";if(res==="changed")persist();sync={status:"ok",at:Date.now(),msg:""};return res}
  catch(e){sync={status:"error",at:sync.at,msg:e.message};return "error"}
}
async function push(){
  if(!canSync||!getCode())return;
  if(pushing){pushAgain=true;return}
  pushing=true;sync.status="busy";
  try{
    const j=await api("GET");if(j.data&&mergeRemote(j.data))persist();
    const posted=await api("POST",{data:snapshot()});
    if(posted.data&&mergeRemote(posted.data))persist();
    pushFails=0;sync={status:"ok",at:Date.now(),msg:""};
  }catch(e){
    sync={status:"error",at:sync.at,msg:e.message};
    if(pushFails<4){pushFails++;clearTimeout(retryTimer);retryTimer=setTimeout(()=>{retryTimer=null;push()},3000*pushFails)}
  }
  pushing=false;if(pushAgain){pushAgain=false;push()}
  else if(view==="admin")admin(true,true);
}
function schedulePush(){if(!canSync||!getCode())return;clearTimeout(pushTimer);pushTimer=setTimeout(()=>{pushTimer=null;push()},800)}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden||!canSync||!getCode())return;
  if(view==="admin")pull().then(r=>{if(r==="changed"&&view==="admin")admin(true,true)});
  else if(view==="home")pull().then(r=>{schedulePush();if(r==="changed"&&view==="home")home()});
});
window.addEventListener("pagehide",()=>{
  if(!canSync||!getCode())return;
  if(!pushTimer&&sync.status!=="error")return;
  clearTimeout(pushTimer);pushTimer=null;
  try{navigator.sendBeacon("/api/progress?code="+encodeURIComponent(getCode()),new Blob([JSON.stringify({data:snapshot()})],{type:"application/json"}))}catch(e){}
});

    <path d="M158 140 C140 128 120 118 100 110 M162 136 C182 124 200 116 220 108 M160 132 L160 96" stroke="var(--bark)" stroke-width="7" fill="none" stroke-linecap="round"/>

}

/* =================== VIEWS =================== */
let lastStars=null;
function go(html,keepScroll){stopAdminPoll();stopTalk();view="";const y=keepScroll?window.scrollY:0;app.innerHTML=html;window.scrollTo(0,y)}
const app=document.getElementById("app");
const backBtn=(label="Home")=>`<button class="btn" id="back">${ICON.back} ${label}</button>`;

function stepBtn(attr,k,nm,status){return `<button class="step" ${attr}><span class="k">${k}</span><span class="nm">${esc(nm)}</span>${status}</button>`}
const doneMark=key=>S.done[key]?`<span class="done">✓ Done</span>`:`<span class="todo">Practice</span>`;
const starMark=id=>S.best[id]?starsRow(starsOf(id)):`<span class="todo">Not tried yet</span>`;

function home(){
  parentOk=false;
  if(canSync&&getCode())pull().then(r=>{schedulePush();if(r==="changed"&&view==="home")home()});
  const total=totalStars();
  const fresh=lastStars==null?0:Math.max(0,total-lastStars);
  lastStars=total;
  const here=currentUnit();
  const streak=calcStreak();
  const badgesGot=badgeList().filter(b=>b.got).length;
  const today=localIso(new Date());
  const watered=S.watered===today;
  const bloomsToday=S.history.filter(h=>h.d===today).reduce((a,h)=>a+(h.stars||0),0);
  const goalN=Math.min(2,bloomsToday);
  const yest=new Date();yest.setDate(yest.getDate()-1);
  const missed=S.days.length&&S.days[S.days.length-1]<localIso(yest);
  const fact=UNITS.find(u=>unitStars(u)===unitMax(u)&&!S.seen.facts.includes(u.n));
  const buddy=fresh>0?"Your tree is getting stronger!":watered?"Thank you for the water!":"I like reading with you.";
  const units=UNITS.map(u=>{
    const open=unitOpen(u.n);
    const st=unitStars(u),mx=unitMax(u),pct=Math.round(100*st/mx);
    const head=`<div class="unithead"><div class="t"><span class="eyebrow">Unit ${u.n}</span><h2>${esc(u.title)}</h2><span class="sub">${esc(u.sub)}</span></div>
      <div class="row" style="justify-content:flex-end">${u.n===here&&open?`<span class="chip">You are here</span>`:""}${open?`<span class="chip count">${st} of ${mx} stars</span>`:""}</div></div>`;
    if(!open){
      const prev=unitOf(u.n-1);
      return `<section class="unit locked">${head}<p class="lockmsg">${ICON.lock} Earn ${UNLOCK_AT} stars in Unit ${prev.n} to open this unit. (${unitStars(prev)} so far)</p></section>`;
    }
    const bar=`<div class="track" role="img" aria-label="Unit ${u.n} is ${pct} percent of the way to all its stars"><div class="fill" style="width:${pct}%"></div></div>${pct>=75&&pct<100?`<p class="tip">Unit ${u.n} almost complete!</p>`:""}`;
    const steps=[
      ...(u.vowels?[stepBtn(`data-act="vowels" data-u="${u.n}"`,"Warm-up","Vowel sounds",starMark(`u${u.n}-vowel`))]:[]),
      stepBtn(`data-act="cards" data-u="${u.n}"`,"1 · Learn","Sound cards",doneMark(`u${u.n}-cards`)),
      stepBtn(`data-act="tap" data-u="${u.n}"`,"2 · Tap","Tap and read",doneMark(`u${u.n}-tap`)),
      stepBtn(`data-act="spell" data-u="${u.n}"`,"3 · Spell","Spell it",starMark(`u${u.n}-spell`)),
      stepBtn(`data-act="trick" data-u="${u.n}"`,"4 · Trick words","Find the word",starMark(`u${u.n}-trick`)),
      ...u.stories.map((s,i)=>stepBtn(`data-story="${s.id}"`,`${5+i} · ${s.kind} story`,s.title,starMark(s.id)))
    ].join("");
    return `<section class="unit ${u.n===here?"here":""}">${head}${bar}<div class="steps">${steps}</div></section>`;
  }).join("");

  const shelf=LEVELS.map(L=>{
    const open=shelfOpen(L.n);
    const cards=SHELF.filter(s=>s.level===L.n).map(s=>`<button class="card" data-story="${s.id}" ${open?"":"disabled"}>
        <span class="kind ${s.kind==="Everyday"?"every":""}">${s.kind}</span><h3>${esc(s.title)}</h3>
        ${open?starsRow(starsOf(s.id)):`<span class="lockmsg">${ICON.lock} Locked</span>`}</button>`).join("");
    const note=open?"":`<span class="note">Pass 2 ${LEVELS[L.n-2].name} stories to open (${shelfPassed(L.n-1)} of 2)</span>`;
    return `<div class="levelhead"><span class="eyebrow">Level ${L.n}</span><h3>${L.name}</h3>${note}</div><div class="cards">${cards}</div>`;
  }).join("");

  document.title=treeTitle();
  const decorPick=total>=5&&!S.decor.flower?`<div class="picker">${Object.entries(FLOWERS).map(([k,c])=>`<button class="swatch" data-flower="${k}" style="background:${c.startsWith("var")?"#e0648c":c}" aria-label="${k} flowers"></button>`).join("")}</div><p class="tip">Pick a flower color for your tree.</p>`
    :total>=10&&!S.decor.bird?`<div class="picker">${Object.keys(BIRDS).map(k=>`<button class="btn" data-bird="${k}">${k} bird</button>`).join("")}</div>`
    :total>=15&&!S.decor.swing?`<button class="btn" id="swing">Add a swing</button>`:"";
  go(`<header class="hero"><h1>${esc(treeTitle())}</h1>
      <p>${childName()==="Hadassah"?"Hadassah means <b>myrtle tree</b>. ":""}Practice your sounds, read the stories, and watch your tree bloom.</p></header>
    <div class="treecard">${treeSvg(total,fresh)}
      ${fresh>0?`<div class="bloomnote pop">${BLOSSOM_ICON}<b>${fresh===1?"A new blossom opened!":fresh+" new blossoms opened!"}</b></div>`:""}
      <div class="tally"><span class="n">${total}</span> blossoms</div>
      <div class="buddy">${BUDDY}<span>${esc(buddy)}</span></div>
      <div class="rule">Every ${starSvg(true)} you earn grows 1 blossom.</div>
      <p class="tip">Today's goal: <b>${goalN} of 2</b> blossoms</p>
      <div class="track" style="width:100%"><div class="fill" style="width:${goalN/2*100}%"></div></div>
      ${streak>=2?`<div class="rule">${ICON.sun} <b>${streak} days in a row!</b> Keep it going.</div>`:""}
      ${missed?`<div class="rule">Your tree missed you yesterday!</div>`:""}
      ${watered?`<div class="rule">The tree had a drink today.</div>`:`<div class="rule">Come water your tree today.</div><button class="btn" id="water">Water the tree</button>`}
      ${decorPick}
      <button class="linkbtn" id="sound">${soundOn()?"Sound on":"Sound off"}</button>
    </div>
    ${fact?`<section class="page" style="gap:8px"><h3>A hidden bud</h3><p>${esc(FACTS[(fact.n-1)%FACTS.length])}</p><button class="btn" id="factok" data-u="${fact.n}">How lovely!</button></section>`:""}
    <div class="sectionhead"><span class="eyebrow">Phonics</span><h2>Sound Units</h2><p>Do the steps in order. Each story uses the sounds from its unit.</p></div>
    ${units}
    <p class="later">More units are on the way as you get there.</p>
    <section class="shelf"><div class="sectionhead"><span class="eyebrow">Bonus</span><h2>Story Shelf</h2><p>Longer stories with harder words. Tap any word to hear it, or have the story read to you.</p></div>${shelf}</section>
    <section class="page" style="gap:12px"><div class="sectionhead"><span class="eyebrow">Rewards</span><h2>My Badges</h2><p>${badgesGot} of ${badgeList().length} earned. Each one tells you how to get it.</p></div><div class="badgegrid">${badgeGrid()}</div></section>
    <div class="center"><button class="linkbtn" id="hername">Change her name</button><button class="linkbtn" id="grown">${ICON.lock} For grown-ups</button></div>`);
  view="home";
  app.querySelectorAll("[data-story]").forEach(b=>b.onclick=()=>read(b.dataset.story));
  app.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const u=unitOf(+b.dataset.u),a=b.dataset.act;
    if(a==="vowels")vowels(u);else if(a==="cards")cards(u);else if(a==="tap")tapRead(u,0);else wordGame(u,a);
  });
  document.getElementById("grown").onclick=()=>gate();
  document.getElementById("hername").onclick=()=>{openName=true;gate()};
  const water=document.getElementById("water");
  if(water)water.onclick=()=>{S.watered=localIso(new Date());save();chime("rustle");home()};
  document.getElementById("sound").onclick=()=>{setSoundOn(!soundOn());if(soundOn())chime("tap");home()};
  app.querySelectorAll("[data-flower]").forEach(b=>b.onclick=()=>{S.decor=Object.assign({},S.decor,{flower:b.dataset.flower});S.decorAt=Date.now();save();chime("bloom");home()});
  app.querySelectorAll("[data-bird]").forEach(b=>b.onclick=()=>{S.decor=Object.assign({},S.decor,{bird:b.dataset.bird});S.decorAt=Date.now();save();chime("bloom");home()});
  const swing=document.getElementById("swing");
  if(swing)swing.onclick=()=>{S.decor=Object.assign({},S.decor,{swing:true});S.decorAt=Date.now();save();chime("click");home()};
  const factok=document.getElementById("factok");
  if(factok)factok.onclick=()=>{const n=+factok.dataset.u;if(!S.seen.facts.includes(n))S.seen.facts.push(n);save();home()};
  let sawMile=false;
  [5,10,15].forEach(m=>{if(total>=m&&!S.seen.miles.includes(m)){S.seen.miles.push(m);sawMile=true}});
  if(sawMile)save();
  if(fresh>0)chime("bloom");
}

/* ---- Warm-up: vowel sounds ---- */
function vowels(u){
  const V=u.vowels;
  go(`<div class="bar">${backBtn()}<span class="tip">Unit ${u.n} · Vowel warm-up</span></div>
    <section class="page"><h2>Vowel Sounds</h2>
      <p class="note">${esc(V.note)}</p>
      <p class="lead">For each card, say the letter, the key word, and the sound: <b>a, apple, /ă/</b>. Tap a card to hear its key word.</p>
      <div class="soundgrid">${V.cards.map(([p,k],i)=>`<button class="sound" data-i="${i}" aria-label="${esc(p)}, as in ${esc(k)}"><span class="pat">${esc(p)}</span><span class="kw"><b>${esc(k[0])}</b>${esc(k.slice(1))}</span></button>`).join("")}</div>
    </section>
    <div class="center"><button class="btn go" id="next">Play: Hear the vowel</button></div>`);
  document.getElementById("back").onclick=home;
  document.getElementById("next").onclick=()=>vowelGame(u);
  app.querySelectorAll(".sound").forEach(b=>b.onclick=()=>{b.classList.add("heard");say(V.cards[+b.dataset.i][1],0.75)});
}
function vowelGame(u,i=0,firsts=[]){
  const V=u.vowels,[word,vow]=V.words[i];
  const k=word.indexOf(vow);
  const masked=`${esc(word.slice(0,k))}<span class="vblank">&nbsp;</span>${esc(word.slice(k+1))}`;
  const dots=V.words.map((_,j)=>`<span class="dot ${j<i?"done":j===i?"now":""}"></span>`).join("");
  go(`<div class="bar">${backBtn()}<div class="dots" role="img" aria-label="Word ${i+1} of ${V.words.length}">${dots}</div></div>
    <section class="page">
      <span class="skill">Vowel sounds</span>
      <p class="q">Listen. Which vowel do you hear in the middle?</p>
      ${canSpeak?`<button class="bigsay" id="sayit" aria-label="Hear the word again">${ICON.speak}</button>`:""}
      <div class="whole" id="whole" aria-live="polite">${masked}</div>
      <div class="opts vowels">${V.cards.map(([p])=>`<button class="opt" data-v="${p}">${p}</button>`).join("")}</div>
      <div id="fb"></div>
    </section>`);
  document.getElementById("back").onclick=home;
  const speakIt=()=>say(word,0.65);
  const sb=document.getElementById("sayit");if(sb)sb.onclick=speakIt;
  setTimeout(speakIt,250);
  let tried=false;const fb=document.getElementById("fb");
  app.querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
    if(btn.dataset.v===vow){
      btn.classList.add("right");app.querySelectorAll(".opt").forEach(b=>b.disabled=true);
      document.getElementById("whole").textContent=word;
      const got=!tried,last=i===V.words.length-1;
      const key=V.cards.find(c=>c[0]===vow)[1];
      fb.innerHTML=`<div class="feedback ok"><b>${got?["Yes!","You got it!","Great listening!","Super!"][i%4]:"Yes! You found it."}</b><span>${esc(vow)}, ${esc(key)}, like in ${esc(word)}.</span><div><button class="btn go" id="next">${last?"See my stars":"Next word"}</button></div></div>`;
      const n=document.getElementById("next");n.focus();
      n.onclick=()=>last?finish({id:`u${u.n}-vowel`,title:`Unit ${u.n}: Vowel sounds`,firsts:[...firsts,got],again:()=>vowelGame(u),unit:u}):vowelGame(u,i+1,[...firsts,got]);
    }else{
      if(!tried){S.words[word]=(S.words[word]||0)+1;save()}
      tried=true;btn.classList.add("wrong","shake");btn.disabled=true;
      fb.innerHTML=`<div class="feedback hint"><b>Not quite. Try again!</b><span>Say the word slowly. Does the middle sound like apple, Ed, itch, octopus, or up?</span></div>`;
      speakIt();
    }
  });
}

/* ---- Step 1: sound cards ---- */
function cards(u){
  const hl=(pat,kw)=>{const p=pat.replace(/^-/,"");const i=kw.lastIndexOf(p);return i<0?esc(kw):esc(kw.slice(0,i))+"<b>"+esc(p)+"</b>"+esc(kw.slice(i+p.length))};
  go(`<div class="bar">${backBtn()}<span class="tip">Unit ${u.n} · Sound cards</span></div>
    <section class="page"><h2>${esc(u.title)}</h2>
      <p class="note">${esc(u.note)}</p>
      <p class="lead">Say the sound. Then tap the card to hear the key word.</p>
      <div class="soundgrid">${u.cards.map(([p,k],i)=>`<button class="sound" data-i="${i}" aria-label="${esc(p)}, as in ${esc(k)}"><span class="pat">${esc(p)}</span><span class="kw">${hl(p,k)}</span></button>`).join("")}</div>
    </section>
    <div class="center"><button class="btn" id="withme">Say it with me</button><button class="btn go" id="next">Next: Tap and read</button></div>`);
  S.done[`u${u.n}-cards`]=true;save();
  document.getElementById("back").onclick=home;
  document.getElementById("next").onclick=()=>cheer("You learned the sounds!",()=>tapRead(u,0));
  let withI=0;
  document.getElementById("withme").onclick=()=>{
    const card=u.cards[withI%u.cards.length];
    const el=app.querySelector(`.sound[data-i="${withI%u.cards.length}"]`);
    if(el){el.classList.add("heard","bounce");setTimeout(()=>el.classList.remove("bounce"),400)}
    say(card[0].replace(/^-/,"")+", "+card[1],0.7);
    chime("tap");withI++;
  };
  app.querySelectorAll(".sound").forEach(b=>b.onclick=()=>{b.classList.add("heard","bounce");chime("tap");setTimeout(()=>b.classList.remove("bounce"),400);say(u.cards[+b.dataset.i][1],0.75)});
}

/* ---- Step 2: tap and read ---- */
function tapRead(u,i){
  const item=u.tap[i];
  const parts=item.filter(x=>typeof x==="string");
  const extra=item.find(x=>typeof x==="object")||{};
  const word=parts.join("").replace(/-/g,"");
  let lit=0;
  go(`<div class="bar">${backBtn()}<span class="tip">Unit ${u.n} · Word ${i+1} of ${u.tap.length}</span></div>
    <section class="page">
      <span class="skill">Tap and read</span>
      <p class="lead">Tap each box and say its sound. Then blend them into one word.</p>
      <div class="taprow">${parts.map((p,k)=>`<button class="tapbox ${p.startsWith("-")?"suffix":""}" data-k="${k}" aria-label="Sound ${k+1}">${esc(p.replace(/^-/,""))}</button>`).join("")}</div>
      <div class="dotrow" aria-hidden="true">${parts.map(()=>`<span class="tapdot"></span>`).join("")}</div>
      <div class="whole dim" id="whole" aria-live="polite">${esc(word)}</div>
      ${extra.n?`<p class="note" style="text-align:center">${esc(extra.n)}</p>`:""}
      <div class="row">
        <button class="btn" id="hear" disabled>${ICON.speak} Check: hear it</button>
        <button class="btn go" id="next" disabled>${i===u.tap.length-1?"All done!":"Next word"}</button>
      </div>
    </section>`);
  document.getElementById("back").onclick=home;
  const boxes=[...app.querySelectorAll(".tapbox")],dots=[...app.querySelectorAll(".tapdot")];
  const hear=document.getElementById("hear"),next=document.getElementById("next");
  boxes.forEach((b,k)=>b.onclick=()=>{
    if(k!==lit)return;
    b.classList.add("lit","grow");dots[k].classList.add("lit");chime("tap");lit++;
    if(lit===parts.length){const whole=document.getElementById("whole");whole.classList.remove("dim");whole.classList.add("glow");chime("whoosh");hear.disabled=false;next.disabled=false;next.focus()}
  });
  hear.onclick=()=>say(word,0.7);
  next.onclick=()=>{if(i<u.tap.length-1)tapRead(u,i+1);else{S.done[`u${u.n}-tap`]=true;save();cheer("You tapped every sound!",()=>wordGame(u,"spell"))}};
}

/* ---- Steps 3 & 4: spell it / find the trick word ---- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function wordGame(u,kind,i=0,firsts=[]){if(kind==="spell")spellTiles(u,i,firsts);else trickSeek(u,i,firsts)}
function spellTiles(u,i=0,firsts=[]){
  const list=u.spell,it=list[i],target=it[0],letters=target.split("");
  const tiles=shuffle(letters.map((ch,n)=>({ch,n})));
  const dots=list.map((_,k)=>`<span class="dot ${k<i?"done":k===i?"now":""}"></span>`).join("");
  const sent=esc(it[3]).replace("___",'<span class="blank"></span>');
  go(`<div class="bar">${backBtn()}<div class="dots" role="img" aria-label="Word ${i+1} of ${list.length}">${dots}</div></div>
    <section class="page">
      <span class="skill">Spell it</span>
      <p class="q">Listen. Drag each letter into the word. You can tap a letter too.</p>
      ${canSpeak?`<button class="bigsay" id="sayit" aria-label="Hear the word again">${ICON.speak}</button>`:""}
      <p class="sentence">${sent}</p>
      <div class="slotrow" id="slots">${letters.map((_,n)=>`<div class="slot" id="slot${n}"></div>`).join("")}</div>
      <div class="tiles" id="tiles">${tiles.map(t=>`<button class="tile" data-n="${t.n}">${esc(t.ch)}</button>`).join("")}</div>
      <div id="fb"></div>
    </section>`);
  document.getElementById("back").onclick=home;
  const speakIt=()=>say(target,0.7);
  const sb=document.getElementById("sayit");if(sb)sb.onclick=speakIt;
  setTimeout(speakIt,250);
  let placed=0,tried=false;
  const fb=document.getElementById("fb");
  function win(){
    const got=!tried,last=i===list.length-1;
    chime("whoosh");
    fb.innerHTML=`<div class="feedback ok"><b>${got?"You got it!":"Yes! You found it."}</b><div><button class="btn go" id="next">${last?"See my stars":"Next word"}</button></div></div>`;
    const n=document.getElementById("next");n.focus();
    n.onclick=()=>last?finish({id:`u${u.n}-spell`,title:`Unit ${u.n}: Spell it`,firsts:[...firsts,got],again:()=>spellTiles(u),unit:u}):spellTiles(u,i+1,[...firsts,got]);
  }
  function take(btn){
    if(btn.disabled)return;
    const ch=letters[btn.dataset.n];
    if(ch===letters[placed]){
      const slot=document.getElementById("slot"+placed);
      slot.textContent=ch;slot.classList.remove("just");void slot.offsetWidth;slot.classList.add("filled","just");
      btn.disabled=true;btn.style.visibility="hidden";
      chime("snap");placed++;
      if(placed===letters.length){document.getElementById("slots").classList.add("glowwin");win()}
    }else{
      if(!tried){S.words[target]=(S.words[target]||0)+1;save()}
      tried=true;btn.classList.add("wrong","shake");
      setTimeout(()=>btn.classList.remove("wrong","shake"),400);
      fb.innerHTML=`<div class="feedback hint"><b>Not quite. Try again!</b><span>Listen again and tap the next letter.</span></div>`;
      speakIt();
    }
  }
  app.querySelectorAll(".tile").forEach(btn=>{
    let ox=0,oy=0,drag=false;
    btn.onpointerdown=e=>{if(btn.disabled)return;drag=true;ox=e.clientX;oy=e.clientY;btn.setPointerCapture(e.pointerId);btn.classList.add("dragging")};
    btn.onpointermove=e=>{if(!drag)return;btn.style.transform=`translate(${e.clientX-ox}px,${e.clientY-oy}px)`};
    btn.onpointerup=e=>{
      if(!drag)return;drag=false;btn.classList.remove("dragging");btn.style.transform="";
      const slot=document.getElementById("slot"+placed);
      const r=slot?slot.getBoundingClientRect():null;
      const moved=Math.hypot(e.clientX-ox,e.clientY-oy)>8;
      const near=r&&e.clientX>r.left-24&&e.clientX<r.right+24&&e.clientY>r.top-24&&e.clientY<r.bottom+24;
      if(!moved||near)take(btn);
    };
  });
}
function trickSeek(u,i=0,firsts=[]){
  const list=u.trick,it=list[i],target=it[0];
  const opts=shuffle([target,...shuffle(list.map(x=>x[0]).filter(w=>w!==target)).slice(0,2)]);
  const dots=list.map((_,k)=>`<span class="dot ${k<i?"done":k===i?"now":""}"></span>`).join("");
  const spots=[[18,58],[46,28],[72,62]];
  go(`<div class="bar">${backBtn()}<div class="dots" role="img" aria-label="Word ${i+1} of ${list.length}">${dots}</div></div>
    <section class="page">
      <span class="skill">${esc(u.trickLabel)}</span>
      <p class="q">Listen. Find the word hiding in the garden.</p>
      ${canSpeak?`<button class="bigsay" id="sayit" aria-label="Hear the word again">${ICON.speak}</button>`:""}
      <p class="sentence">${esc(it[1]).replace("___",'<span class="blank"></span>')}</p>
      <div class="seek">
        <svg viewBox="0 0 320 140" aria-hidden="true"><rect width="320" height="90" fill="#d7ebe3"/><rect y="90" width="320" height="50" fill="#8fbf9a"/><circle cx="250" cy="36" r="16" fill="#efb12a"/><ellipse cx="70" cy="108" rx="28" ry="10" fill="#2e6a4e"/></svg>
        ${opts.map((o,k)=>`<button class="hid" style="left:${spots[k][0]}%;top:${spots[k][1]}%" data-k="${k}">${esc(o)}</button>`).join("")}
      </div>
      <div id="fb"></div>
    </section>`);
  document.getElementById("back").onclick=home;
  const speakIt=()=>say(target,0.7);

    }else{
      if(!tried){S.words[target]=(S.words[target]||0)+1;save()}

function sceneSvg(bits){
  const xs=[70,160,250];

  return `<svg class="storyscene" viewBox="0 0 320 168" role="img" aria-label="${esc(bits.join(", "))}"><rect width="320" height="112" fill="#d7ebe3"/><rect y="112" width="320" height="56" fill="#8fbf9a"/><circle cx="286" cy="26" r="14" fill="#efb12a"/>${shapes}</svg>`;
}
function read(id){
  const s=byId(id),tricks=trickSet(s),scene=SCENES[id];
  const meta=s.unit?`Unit ${s.unit} story`:`Story Shelf · Level ${s.level} · ${LEVELS[s.level-1].name}`;
  const paras=s.text.map(p=>`<p>${p.split(/(\s+)/).map(t=>{if(!/\S/.test(t))return t;const bare=t.toLowerCase().replace(/[^a-z']/g,"");return `<span class="w ${tricks.has(bare)?"trick":""}">${esc(t)}</span>`}).join("")}</p>`).join("");
  go(`<div class="bar">${backBtn()}
      ${canSpeak?`<button class="btn" id="talk">${ICON.speak} Read it to me</button>`:""}</div>
    <article class="page">
      <div class="meta"><span class="kind ${s.kind==="Everyday"?"every":""}">${s.kind}</span><span class="tip">${meta}</span></div>
      <h2>${esc(s.title)}</h2>
      ${scene?sceneSvg(scene.bits):""}
      <div class="story">${paras}</div>
      <p class="tip">${tricks.size?"Wavy lines mark this unit's trick words. ":""}${canSpeak?"Stuck on a word? Tap it to hear it.":""}</p>
      <div class="row">
        ${canSpeak?`<button class="btn" id="line">Read one line</button>`:""}
        <button class="btn" id="rec">Hear me read</button>
      </div>
      <div id="recbox"></div>
    </article>
    <div class="center"><button class="btn go" id="ready">I'm done reading!</button></div>`);
  document.getElementById("back").onclick=home;
  document.getElementById("ready").onclick=()=>storyMoment(id);
  const talk=document.getElementById("talk");
  if(talk){let on=false;talk.onclick=()=>{
    if(on){stopTalk();on=false;talk.innerHTML=`${ICON.speak} Read it to me`;return}
    on=true;talk.innerHTML=`${ICON.stop} Stop reading`;
    say(s.title+". "+s.text.join(" "),0.85,()=>{on=false;talk.innerHTML=`${ICON.speak} Read it to me`});
  }}
  const line=document.getElementById("line");
  if(line){let li=0;line.onclick=()=>{
    stopTalk();
    const ps=[...app.querySelectorAll(".story p")];
    ps.forEach(p=>p.classList.remove("on"));
    if(!ps.length)return;
    if(li>=ps.length)li=0;
    ps[li].classList.add("on");ps[li].scrollIntoView({block:"nearest"});
    say(ps[li].textContent,0.85);li++;
  }}
  let recorder=null;
  document.getElementById("rec").onclick=async()=>{
    const box=document.getElementById("recbox"),btn=document.getElementById("rec");
    if(recorder&&recorder.state==="recording"){recorder.stop();return}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder!=="function"){box.innerHTML=`<p class="tip">This iPad cannot use the microphone here. You can still read the story.</p>`;return}
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const chunks=[];
      recorder=new MediaRecorder(stream);
      recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
      recorder.onstop=()=>{
        stream.getTracks().forEach(t=>t.stop());
        const url=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType||"audio/webm"}));
        box.innerHTML=`<audio controls src="${url}"></audio><p class="tip">This stays on this iPad. It is not saved with your lessons.</p>`;
        btn.textContent="Hear me read";
      };
      recorder.start();btn.textContent="Stop and play it back";
    }catch(e){box.innerHTML=`<p class="tip">The microphone stayed off, and that is all right. You can still read the story.</p>`}
  };
  app.querySelectorAll(".w").forEach(w=>w.onclick=()=>{
    app.querySelectorAll(".w.said").forEach(x=>x.classList.remove("said"));
    w.classList.add("said");say(w.textContent.replace(/[^\w']/g,""),0.7);
    setTimeout(()=>w.classList.remove("said"),1200);
  });
}
function storyMoment(id){
  const scene=SCENES[id];
  if(!scene)return quiz(id);
  go(`<div class="bar">${backBtn("Back to story")}</div>
    <section class="page">
      <h2>${esc(scene.prompt)}</h2>
      ${sceneSvg(scene.bits)}
      <div class="opts">${scene.bits.map((b,k)=>`<button class="opt" data-k="${k}">${esc(b)}</button>`).join("")}</div>
      <div id="fb"></div>
    </section>`);
  document.getElementById("back").onclick=()=>read(id);
  app.querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
    const b=scene.bits[+btn.dataset.k];
    if(b===scene.ok){
      chime("whoosh");btn.classList.add("right");
      app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      document.getElementById("fb").innerHTML=`<div class="feedback ok"><b>You found it!</b><div><button class="btn go" id="next">Story questions</button></div></div>`;
      document.getElementById("next").onclick=()=>quiz(id);
    }else{btn.classList.add("wrong","shake");setTimeout(()=>btn.classList.remove("wrong","shake"),400)}
  });
}

function quiz(id,i=0,firsts=[]){
  const s=byId(id),q=s.qs[i];
  const opts=shuffle(q.o.map((t,k)=>({t,ok:k===0})));
  const dots=s.qs.map((_,k)=>`<span class="dot ${k<i?"done":k===i?"now":""}"></span>`).join("");
  go(`<div class="bar"><button class="btn" id="back">${ICON.back} Back to story</button><div class="dots" role="img" aria-label="Question ${i+1} of ${s.qs.length}">${dots}</div></div>
    <section class="page">
      <span class="skill">${SKILL[q.s]}</span>
      <div class="bar" style="align-items:flex-start"><p class="q" style="flex:1;min-width:0">${esc(q.q)}</p>
        ${canSpeak?`<button class="btn" id="sayq" aria-label="Read the question to me">${ICON.speak}</button>`:""}</div>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="ab">${"ABC"[k]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
      <div id="fb"></div>
    </section>`);
  document.getElementById("back").onclick=()=>read(id);
  const sq=document.getElementById("sayq");
  if(sq)sq.onclick=()=>say(q.q+" "+opts.map((o,k)=>"ABC"[k]+": "+o.t).join(". "),0.85);
  let tried=false;const fb=document.getElementById("fb");
  app.querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
    const o=opts[+btn.dataset.k];
    if(o.ok){
      btn.classList.add("right");app.querySelectorAll(".opt").forEach(b=>b.disabled=true);
      const got=!tried,last=i===s.qs.length-1;
      fb.innerHTML=`<div class="feedback ok"><b>${got?["You got it!","Yes! Great reading!","Exactly right!","Super job!"][i%4]:"Yes! You found it."}</b><div><button class="btn go" id="next">${last?"See my stars":"Next question"}</button></div></div>`;
      const n=document.getElementById("next");n.focus();
      n.onclick=()=>last?finish({id,title:s.title,firsts:[...firsts,got],again:()=>read(id),unit:s.unit?unitOf(s.unit):null,skills:s.qs.map(q=>q.s)}):quiz(id,i+1,[...firsts,got]);
    }else{
      tried=true;btn.classList.add("wrong","shake");btn.disabled=true;
      fb.innerHTML=`<div class="feedback hint"><b>Not quite. Try again!</b><span>${esc(q.h)}</span>
        <div><button class="btn" id="peek">Look back at the story</button></div><div id="peekbox"></div></div>`;
      document.getElementById("peek").onclick=e=>{
        const box=document.getElementById("peekbox");
        if(box.innerHTML){box.innerHTML="";e.target.textContent="Look back at the story";return}
        box.innerHTML=`<div class="peek">${s.text.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`;
        e.target.textContent="Hide the story";
      };
    }
  });
}

/* ---- Result ---- */
function finish({id,title,firsts,again,unit,skills}){
  const total=firsts.length,right=firsts.filter(Boolean).length,stars=starsFor(right,total);
  const unitsBefore=UNITS.map(u=>unitOpen(u.n)),shelfBefore=LEVELS.map(L=>shelfOpen(L.n));
  const prev=S.best[id]||{stars:0,score:0,tries:0};
  const unitBefore=unit?unitStars(unit):0,unitFull=unit?unitMax(unit):0;
  const badgesBefore=new Set(badgeList().filter(b=>b.got).map(b=>b.n));
  const newBest=Math.max(prev.stars,stars);
  const gained=newBest-prev.stars;
  const now=new Date(),today=localIso(now);
  S.best[id]={stars:newBest,score:Math.max(prev.score||0,right),total,tries:(prev.tries||0)+1,last:today};
  S.history.push({d:today,t:now.toLocaleTimeString("en",{hour:"numeric",minute:"2-digit"}),ts:now.getTime(),id,right,total,stars});
  if(S.history.length>300)S.history=S.history.slice(-300);
  if(!S.days.includes(today))S.days.push(today);
  if(skills)skills.forEach((sk,k)=>{const a=S.skills[sk]||(S.skills[sk]=[0,0]);a[1]++;if(firsts[k])a[0]++});
  save();
  const newBadges=badgeList().filter(b=>b.got&&!badgesBefore.has(b.n));
  const newUnits=UNITS.filter((u,k)=>!unitsBefore[k]&&unitOpen(u.n));
  const newShelf=LEVELS.filter((L,k)=>!shelfBefore[k]&&shelfOpen(L.n));
  const msg=stars===3?"Every one right on the first try!":stars===2?"Great work! You were so close.":"You finished! Practice makes it stronger.";
  const warm=gained>0?"Your tree is getting stronger!":"Nice reading!";
  const gainLine=gained>0?`<div class="gain">${BLOSSOM_ICON}<span>+${gained} new blossom${gained>1?"s":""} on your tree!</span></div>`
    :`<div class="gain">${BLOSSOM_ICON}<span>Your best here is ${prev.stars} star${prev.stars>1?"s":""}, so no new blossoms this time.</span></div>`;
  const nextGoal=newBest<3?`<p class="tip">To grow your 3rd blossom here, try again and get all ${total} right on the first try.</p>`:"";
  const key=`<div class="keyrow" aria-label="How stars work">
      ${starsRow(3)}<span class="${stars===3?"me":""}">All ${total} right on the first try</span>
      ${starsRow(2)}<span class="${stars===2?"me":""}">${Math.ceil(total*2/3)} or more right on the first try</span>
      ${starsRow(1)}<span class="${stars===1?"me":""}">You finished!</span></div>`;
  const justUnit=unit&&unitBefore<unitFull&&unitStars(unit)===unitFull;
  const petals=[...Array(14)].map((_,i)=>`<i style="--x:${(i-7)*22}px;background:${["var(--blossom)","var(--leaf)","var(--sun)"][i%3]};animation-delay:${i*0.04}s"></i>`).join("");
  go(`<section class="page result">
      <h2>You did it!</h2>
      <div class="confetti" aria-hidden="true">${petals}</div>
      <div class="flywrap"><div class="minitree ${gained>0?"land":""}">${treeSvg(totalStars(),gained)}</div>${gained>0?`<span class="flystar go">${starSvg(true)}</span>`:""}</div>
      <div class="buddy">${BUDDY}<span>${esc(warm)}</span></div>
      <div class="bigstars">${[0,1,2].map(k=>starSvg(k<stars,k<stars?"pop":"",`animation-delay:${k*.25}s`)).join("")}</div>
      <p class="q">${esc(title)}</p>
      <p class="q">${msg}</p>
      <p class="tip">${right} of ${total} right on the first try = ${stars} star${stars>1?"s":""}</p>
      ${gainLine}${nextGoal}${key}
      ${newBadges.map(b=>`<div class="gain pop">${badgeIcon(b)}<span>New badge: ${esc(b.n)}!</span></div>`).join("")}
      ${justUnit?`<div class="unlock">Unit ${unit.n} is complete!</div>`:""}
      ${newUnits.map(u=>`<div class="unlock">Unit ${u.n} is open: ${esc(u.title)}!</div>`).join("")}
      ${newShelf.map(L=>`<div class="unlock">Story Shelf Level ${L.n}, ${L.name}, is open!</div>`).join("")}
      <div class="row"><button class="btn" id="again">Try again</button><button class="btn go" id="tree">Grow my tree</button></div>
    </section>`);
  document.getElementById("again").onclick=again;
  document.getElementById("tree").onclick=home;
  chime("bloom");
  if(canSpeak)setTimeout(()=>say("You did it! "+(gained>0?warm+" ":"")+msg,0.9),650);
}
function cheer(line,next){
  const petals=[...Array(12)].map((_,i)=>`<i style="--x:${(i-6)*24}px;background:${i%2?"var(--leaf)":"var(--blossom)"};animation-delay:${i*0.04}s"></i>`).join("");
  go(`<section class="page result">
      <h2>You did it!</h2>
      <div class="confetti" aria-hidden="true">${petals}</div>
      <div class="buddy">${BUDDY}<span>${esc(line)}</span></div>
      <button class="btn go" id="next">Keep going</button>
    </section>`);
  document.getElementById("next").onclick=next;
  chime("bloom");
  if(canSpeak)setTimeout(()=>say("You did it! "+line,0.9),500);
}

/* ---- Badges: shown on her home screen, announced on the result screen ---- */
function calcStreak(){
  if(!S.days.length)return 0;
  const set=new Set(S.days),d=new Date();
  if(!set.has(localIso(d))){d.setDate(d.getDate()-1);if(!set.has(localIso(d)))return 0}
  let n=0;while(set.has(localIso(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}
function badgeList(){
  const total=totalStars(),streak=calcStreak();
  return [
   {n:"First Sprout",how:"Finish your first game or story",got:Object.keys(S.best).length>=1,ic:"leaf"},
   {n:"Little Blossom",how:"Grow 10 blossoms",got:total>=10,ic:"blossom"},
   {n:"Blooming Bright",how:"Grow 25 blossoms",got:total>=25,ic:"blossom"},
   {n:"Mighty Myrtle",how:"Grow 50 blossoms",got:total>=50,ic:"tree"},
   {n:"Full Bloom",how:"Grow all "+MAXSTARS+" blossoms",got:total>=MAXSTARS,ic:"tree"},
   {n:"Star Reader",how:"3 stars on any story",got:ALLSTORIES.some(s=>starsOf(s.id)===3),ic:"star"},
   {n:"Bookworm",how:"3 stars on 3 stories",got:ALLSTORIES.filter(s=>starsOf(s.id)===3).length>=3,ic:"book"},
   {n:"Unit Champion",how:"Every star in one unit",got:UNITS.some(u=>unitStars(u)===unitMax(u)),ic:"medal"},
   {n:"Super Speller",how:"3 stars on a Spell It game",got:UNITS.some(u=>starsOf(`u${u.n}-spell`)===3),ic:"medal"},
   {n:"Sound Detective",how:"3 stars on a Trick Words game",got:UNITS.some(u=>starsOf(`u${u.n}-trick`)===3),ic:"medal"},
   {n:"Sharp Ears",how:"3 stars on the Vowel warm-up",got:starsOf("u2-vowel")===3,ic:"sun"},
   {n:"Three in a Row",how:"Practice 3 days in a row",got:streak>=3,ic:"sun"},
   {n:"Week of Wonder",how:"Practice 7 days in a row",got:streak>=7,ic:"sun"}];
}
const badgeIcon=b=>b.ic==="star"?starSvg(true):b.ic==="blossom"?BLOSSOM_ICON:ICON[b.ic];
const badgeGrid=()=>badgeList().map(b=>`<div class="badge ${b.got?"on":"off"}"><span class="med">${b.got?badgeIcon(b):ICON.lock}</span><b>${esc(b.n)}</b><small>${esc(b.how)}</small></div>`).join("");
const nameOf=id=>{const st=byId(id);if(st)return st.title;
  const m=/^u(\d+)-(\w+)$/.exec(id);
  if(m){const names={spell:"Spell It",trick:"Trick Words",vowel:"Vowel Warm-up"};return `Unit ${m[1]}: ${names[m[2]]||m[2]}`}
  return id};

/* ---- Grown-up gate: a 4-digit PIN, set on the first visit and asked for on every visit ---- */
function gate(resetPin){
  if(parentOk&&!resetPin)return admin();
  const setting=resetPin||!getPin();
  let first=null;
  const draw=(title,hint)=>{
    go(`<div class="bar">${backBtn()}<span class="tip">For grown-ups</span></div>
      <section class="page result">
        <span class="bigsay" aria-hidden="true">${ICON.lock}</span>
        <h2>${title}</h2>
        ${hint?`<p class="lead">${hint}</p>`:""}
        <input class="pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="4-digit PIN">
        <div id="fb"></div>
        <button class="btn go" id="pinok">${setting?"Save PIN":"Open the log"}</button>
        ${!setting?`<button class="linkbtn" id="forgot">Forgot your PIN?</button>`
          :!resetPin?`<button class="linkbtn" id="connect">Already set up on her device? Connect this phone with your family code</button>`:""}
      </section>`);
    document.getElementById("back").onclick=home;
    const fg=document.getElementById("forgot");if(fg)fg.onclick=forgotScreen;
    const cn=document.getElementById("connect");if(cn)cn.onclick=connectScreen;
    const inp=document.getElementById("pin");inp.focus();
    const flash=t=>{document.getElementById("fb").innerHTML=`<div class="feedback hint"><b>${t}</b></div>`;inp.value="";inp.classList.add("shake");setTimeout(()=>inp.classList.remove("shake"),400);inp.focus()};
    const submit=()=>{
      const v=inp.value;
      if(!/^\d{4}$/.test(v)){flash("Please type 4 numbers.");return}
      if(setting){
        if(first===null){first=v;draw("Type it once more","Just to make sure it's right.");return}
        if(v!==first){first=null;draw("Set a grown-up PIN","Those didn't match. Let's start again.");return}
        setPin(v);schedulePush();parentOk=true;
        if(getCode())admin();else codeScreen();return;
      }
      if(hashPin(v)===getPin()){parentOk=true;admin()}else flash("That's not the PIN.");
    };
    document.getElementById("pinok").onclick=submit;
    inp.onkeydown=e=>{if(e.key==="Enter")submit()};
  };
  draw(setting?"Set a grown-up PIN":"Enter your PIN",setting?"Pick 4 numbers only you know. You'll need them to see the lesson log.":"");
}
/* Small text-entry screens that share one layout: choose / connect / forgot */
function codeForm({title,lead,button,placeholder,onSubmit}){
  go(`<div class="bar">${backBtn()}<span class="tip">For grown-ups</span></div>
    <section class="page result">
      <span class="bigsay" aria-hidden="true">${ICON.lock}</span>
      <h2>${title}</h2>
      <p class="lead">${lead}</p>
      <input class="pin code" id="code" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Family code" placeholder="${esc(placeholder||"family code")}">
      <div id="fb"></div>
      <button class="btn go" id="ok">${button}</button>
    </section>`);
  document.getElementById("back").onclick=home;
  const inp=document.getElementById("code"),fb=document.getElementById("fb");inp.focus();
  const show=(b,s)=>{fb.innerHTML=`<div class="feedback hint"><b>${b}</b>${s?`<span>${s}</span>`:""}</div>`};
  const submit=()=>onSubmit(normCode(inp.value),show,fb);
  document.getElementById("ok").onclick=submit;inp.onkeydown=e=>{if(e.key==="Enter")submit()};
}
function codeScreen(){
  codeForm({title:"Choose a family code",button:"Save family code",placeholder:"for example: myrtle tree 7",
    lead:"A word or short phrase only grown-ups know, at least 6 letters. It lets you see her lessons from your own phone, and it resets the PIN if you ever forget it. Write it down somewhere safe.",
    onSubmit:(c,show)=>{if(c.length<6){show("Make it at least 6 letters.");return}setCode(c);sync={status:"idle",at:0,msg:""};schedulePush();admin()}});
}
function connectScreen(){
  codeForm({title:"Connect with your family code",button:"Connect",
    lead:"Type the family code you chose on her device, and her lessons will show up here on this phone.",
    onSubmit:async(c,show,fb)=>{
      if(c.length<6){show("The family code is at least 6 letters.");return}
      if(!canSync){show("Connecting needs the website.","Open the app's web address instead of the file.");return}
      fb.innerHTML=`<p class="tip">Connecting…</p>`;
      const prev=getCode();setCode(c);
      const res=await pull();
      if(res==="error"){setCode(prev);show("Couldn't connect.",esc(sync.msg));return}
      if(res==="none"){setCode(prev);show("No progress found for that family code.","Check the spelling, or set the code on her device first: For grown-ups → Set a PIN → Choose a family code.");return}
      parentOk=true;admin(true);
    }});
}
function forgotScreen(){
  const code=getCode();
  if(!code){go(`<div class="bar">${backBtn()}<span class="tip">For grown-ups</span></div>
    <section class="page result"><span class="bigsay" aria-hidden="true">${ICON.lock}</span><h2>Forgot your PIN?</h2>
    <p class="lead">No family code was set on this device, so the PIN can't be reset here. The grown-up who set it can change it from inside the log (All activities and settings → Change PIN).</p></section>`);
    document.getElementById("back").onclick=home;return}
  codeForm({title:"Forgot your PIN?",button:"Continue",lead:"Type your family code to choose a new PIN.",
    onSubmit:(c,show)=>{if(c===code)gate(true);else show("That's not the family code.")}});
}

/* ---- Lesson Log: for grown-ups only, behind the PIN ---- */
function admin(noPull,keepScroll){
  const keepDetails=!!app.querySelector("details.grown[open]");
  if(!noPull&&canSync&&getCode())pull().then(()=>{if(view==="admin")admin(true,true)});
  const now=new Date(),today=localIso(now),day0=d=>new Date(d+"T00:00");
  const todays=S.history.filter(h=>h.d===today);
  const lastDay=S.days.length?S.days[S.days.length-1]:Object.values(S.best).map(b=>b.last).filter(Boolean).sort().pop();
  const ago=lastDay?Math.round((day0(today)-day0(lastDay))/864e5):null;
  const niceDate=now.toLocaleDateString("en",{weekday:"long",month:"long",day:"numeric"});
  const code=getCode();
  const approveLine=canSync&&code?`<p>When you see the lessons you asked for, approve her Screen Time request on this phone. You don't need her iPad.</p>`:"";
  const todayCard=todays.length
    ?`<section class="page today yes" id="today" style="gap:8px"><span class="eyebrow">Today · ${niceDate}</span><h2>✓ ${todays.length} lesson${todays.length>1?"s":""} done</h2>
       <ul>${todays.map(h=>`<li>${esc(nameOf(h.id))} — ${h.right} of ${h.total}${h.t?", "+h.t:""}</li>`).join("")}</ul>${approveLine}</section>`
    :`<section class="page today no" id="today" style="gap:8px"><span class="eyebrow">Today · ${niceDate}</span><h2>No lessons done yet today</h2>
       <p>${lastDay?ago===0?"She finished something today, but before the lesson log was switched on.":`Last finished lesson: ${lastDay}${ago===1?" (yesterday)":ago>1?` (${ago} days ago)`:""}.`:"Nothing finished yet — the log starts with her first game or story."}</p>${approveLine}</section>`;
  const week=S.history.filter(h=>(day0(today)-day0(h.d))/864e5<7).length;
  const streak=calcStreak(),total=totalStars();
  const perfects=Object.values(S.best).filter(b=>b.stars===3).length;
  const nexts=[];
  const nu=UNITS.find(u=>!unitOpen(u.n));
  if(nu){const need=Math.max(0,UNLOCK_AT-unitStars(unitOf(nu.n-1)));
    nexts.push(need>0?`Earn ${need} more star${need>1?"s":""} in Unit ${nu.n-1} to open Unit ${nu.n}: ${esc(nu.title)}.`:`Unit ${nu.n} is ready to explore!`)}
  const sl=LEVELS.find(L=>!shelfOpen(L.n));
  if(sl){const need=Math.max(0,2-shelfPassed(sl.n-1));
    nexts.push(need>0?`Pass ${need} more ${LEVELS[sl.n-2].name} shelf story to open Story Shelf Level ${sl.n}.`:`Shelf Level ${sl.n} is ready to explore!`)}
  if(!nexts.length)nexts.push("Every unit and shelf level is open — amazing work!");
  const skillRows=Object.keys(SKILL).map(k=>{const a=S.skills[k]||[0,0];const pct=a[1]?Math.round(100*a[0]/a[1]):null;
    return `<div class="barrow"><span>${SKILL[k]}</span><span class="pct">${pct==null?"not tried yet":pct+"% first try"}</span><div class="track"><div class="fill" style="width:${pct||0}%"></div></div></div>`}).join("");
  const unitRows=UNITS.map(u=>{const open=unitOpen(u.n),st=unitStars(u);
    return `<div class="barrow"><span>Unit ${u.n} · ${esc(u.title)}</span><span class="pct">${open?st+" / "+unitMax(u):"locked"}</span><div class="track"><div class="fill" style="width:${Math.round(100*st/unitMax(u))}%"></div></div></div>`}).join("");
  const wordList=Object.entries(S.words).sort((a,b)=>b[1]-a[1]).slice(0,14);
  const wordsHtml=wordList.length
    ?`<div class="chips">${wordList.map(([w,c])=>`<button class="chipword" data-w="${esc(w)}">${esc(w)}<i>×${c}</i></button>`).join("")}</div><p class="tip">Words she missed on the first try. Tap one to hear it — great ones to practice together.</p>`
    :`<p class="tip">No tricky words collected yet. Words show up here when a spelling or trick-word game needs a second try.</p>`;
  const dayCells=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(13-i));
    const on=S.days.includes(localIso(d));
    return `<div class="day ${on?"on":""}" title="${localIso(d)}">${on?starSvg(true,"","width:15px;height:15px"):d.toLocaleDateString("en",{weekday:"narrow"})}</div>`}).join("");
  const histRows=[...S.history].reverse().slice(0,20).map(h=>`<tr><td>${h.d}</td><td>${h.t||"–"}</td><td>${esc(nameOf(h.id))}</td><td>${h.right}/${h.total}</td><td>${starsRow(h.stars)}</td></tr>`).join("");
  const row=(lbl,name,id)=>{const b=S.best[id];return `<tr><td>${lbl}</td><td>${esc(name)}</td><td>${b?(b.score+"/"+(b.total||4)):"–"}</td><td>${b?b.stars:0}</td><td>${b?b.tries:0}</td><td>${b?b.last:"–"}</td></tr>`};
  const rows=[...UNITS.flatMap(u=>[...(u.vowels?[row(`U${u.n}`,"Vowel sounds",`u${u.n}-vowel`)]:[]),row(`U${u.n}`,"Spell it",`u${u.n}-spell`),row(`U${u.n}`,"Trick words",`u${u.n}-trick`),...u.stories.map(s=>row(`U${u.n}`,s.title,s.id))]),...SHELF.map(s=>row(`Shelf ${s.level}`,s.title,s.id))].join("");
  const homeScreen=`<p>On her iPad, tap Share, then <b>Add to Home Screen</b>, and open Reading Tree from that icon. It opens full screen with no address bar, so Guided Access can't reach another website. If the icon was added before today, delete it and add it again.</p>`;
  const syncLine=()=>{
    if(!code)return "";
    if(!canSync)return `<p class="tip">Sync starts working once the app is on its website. The family code still resets the PIN.</p>`;
    const t=sync.at?new Date(sync.at).toLocaleTimeString("en",{hour:"numeric",minute:"2-digit"}):"";
    return `<p class="tip">${sync.status==="busy"?"Checking for updates…":sync.status==="error"?"Sync problem: "+esc(sync.msg):sync.status==="ok"?"Synced · updated "+t:"Sync is on."}</p>`;
  };
  const syncSection=code
    ?`<section class="page" style="gap:10px"><h3>See her lessons from your phone</h3>
       <p>Family code: <b>${esc(code)}</b></p>${syncLine()}
       ${homeScreen}
       ${canSync?`<p class="tip">On your phone, open <b>${esc(location.origin)}</b>, tap <b>For grown-ups</b>, then <b>Connect this phone with your family code</b>. Her finished lessons show up here, including <b>✓ 2 lessons done</b>, and you can approve Screen Time without her iPad.</p>`:""}
       <div class="row" style="justify-content:flex-start">${canSync?`<button class="btn" id="syncNow">Sync now</button>`:""}<button class="btn" id="changeCode">Change family code</button></div></section>`
    :`<section class="page" style="gap:10px"><h3>See her lessons from your phone</h3>
       <p class="tip">Choose a family code and this log will show up on any phone where you type the same code. It also resets the PIN if you forget it.</p>
       ${homeScreen}
       <div class="row" style="justify-content:flex-start"><button class="btn" id="changeCode">Choose a family code</button></div></section>`;
  const nameCard=`<section class="page" id="namecard" style="gap:10px"><h3>Her name</h3>
    <p class="tip">The home screen uses this name. It stays if you start over.</p>
    <div class="row" style="justify-content:flex-start">
      <input class="pin code" id="childname" maxlength="24" value="${esc(childName())}" autocomplete="off" aria-label="Her name">
      <button class="btn" id="savename">Save name</button>
    </div></section>`;
  go(`<div class="bar"><button class="btn" id="back">${ICON.lock} Lock and go home</button><span class="tip">For grown-ups · Lesson Log</span></div>
    ${nameCard}
    ${todayCard}
    <div class="stats">
      <div class="stat">${ICON.book}<span class="big">${week}</span><span>lesson${week===1?"":"s"} this week</span></div>
      <div class="stat">${ICON.sun}<span class="big">${streak}</span><span>day${streak===1?"":"s"} in a row</span></div>
      <div class="stat">${starSvg(true)}<span class="big">${perfects}</span><span>perfect games</span></div>
      <div class="stat">${ICON.tree}<span class="big">${total}</span><span>of ${MAXSTARS} blossoms</span></div>
    </div>
    ${code&&canSync?syncLine():""}
    <section class="page" style="gap:10px"><h3>Last two weeks</h3><div class="dayrow">${dayCells}</div><p class="tip">A star on every day with at least one finished game or story.</p></section>
    <section class="page" style="gap:10px"><h3>Lesson log</h3>${S.history.length
      ?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Time</th><th>Lesson</th><th>Score</th><th>Stars</th></tr></thead><tbody>${histRows}</tbody></table></div><p class="tip">Her last ${Math.min(20,S.history.length)} finished games and stories, newest first.</p>`
      :`<p class="tip">Every finished game or story will show up here with its date, time and score.</p>`}</section>
    <section class="page" style="gap:12px"><h3>Unit progress</h3>${unitRows}<p class="tip">${nexts.join(" ")}</p></section>
    <section class="page" style="gap:12px"><h3>Comprehension skills</h3><p class="tip">First-try correct on story quiz questions, all stories combined.</p>${skillRows}</section>
    <section class="page" style="gap:10px"><h3>Words to practice</h3>${wordsHtml}</section>
    ${syncSection}
    <details class="grown"><summary>All activities and settings</summary><div class="gbody">
      <div class="tablewrap"><table><thead><tr><th>Where</th><th>Activity</th><th>Best</th><th>Stars</th><th>Tries</th><th>Last</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="small">Stars: all right on the first try = 3, two-thirds or more = 2, finishing = 1. Only the best result counts, and every star is one blossom, so a retry can only add blossoms. The Sound Units follow the Fundations Level 2 order, so practice matches class.</p>
      <div class="row" style="justify-content:flex-start">
        <button class="btn" id="unlockAll">${S.unlockAll?"Use normal unlocking":"Open all units and levels"}</button>
        <button class="btn" id="changePin">Change PIN</button>
        <button class="btn danger" id="reset">Start over</button>
      </div><div id="confirm"></div></div></details>`, !!keepScroll);
  view="admin";
  if(keepDetails){const d=app.querySelector("details.grown");if(d)d.open=true}
  if(canSync&&code)adminPoll=setInterval(async()=>{
    if(view!=="admin"||pushing||document.hidden)return;
    if(document.activeElement&&document.activeElement.id==="childname")return;
    const box=document.getElementById("confirm");
    if(box&&box.innerHTML)return;
    const r=await pull();
    if(r==="changed"&&view==="admin")admin(true,true);
  },15000);
  document.getElementById("back").onclick=home;
  app.querySelectorAll(".chipword").forEach(b=>b.onclick=()=>say(b.dataset.w,0.7));
  document.getElementById("unlockAll").onclick=()=>{S.unlockAll=!S.unlockAll;S.settingsAt=Date.now();save();admin(true)};
  document.getElementById("savename").onclick=()=>{
    const v=(document.getElementById("childname").value||"").replace(/[<>&]/g,"").trim().slice(0,24)||"Hadassah";
    if(v!==childName()||!S.childName){S.childName=v;S.nameAt=Date.now();save()}
    admin(true,true);
  };
  if(openName){openName=false;const nm=document.getElementById("childname");if(nm){nm.focus();nm.select()}}
  document.getElementById("changePin").onclick=()=>gate(true);
  document.getElementById("changeCode").onclick=codeScreen;
  const sn=document.getElementById("syncNow");if(sn)sn.onclick=()=>{sync.status="busy";admin(true);push()};
  document.getElementById("reset").onclick=()=>{
    const c=document.getElementById("confirm");
    c.innerHTML=`<div class="feedback hint"><b>Clear all stars, badges, blossoms and the lesson log${code&&canSync?" on every connected device":""}?</b><div class="row" style="justify-content:flex-start"><button class="btn danger" id="yes">Yes, start over</button><button class="btn" id="no">Keep progress</button></div></div>`;
    document.getElementById("no").onclick=()=>c.innerHTML="";
    document.getElementById("yes").onclick=()=>{
      const keep={childName:S.childName,nameAt:S.nameAt,decor:S.decor,decorAt:S.decorAt};
      S={best:{},done:{},unlockAll:false,history:[],days:[],skills:{},words:{},resetAt:Date.now(),settingsAt:0,watered:"",seen:{miles:[],facts:[]},...keep};
      save();lastStars=0;admin(true);
    };
  };
}

/* Opening the page with #forgot on the end of the address lets a grown-up set a new PIN without losing any progress. */
if(location.hash==="#forgot"){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}gate(true)}else home();
